services:
  postgres:
    image: postgres:16-alpine
    container_name: form_builder_postgres
    environment:
      POSTGRES_DB: form_builder
      POSTGRES_USER: form_builder
      POSTGRES_PASSWORD: form_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form_builder -d form_builder"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
